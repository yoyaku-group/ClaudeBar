name: Build YOYAKU Theme

on:
  # Manual-only (rules/02 cost discipline): a macOS runner minute bills at 10x a
  # Linux one — no per-push builds. Trigger from the Actions tab when needed.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA to build
        required: true
        type: string

env:
  APP_NAME: ClaudeBar

jobs:
  build:
    name: Build YOYAKU ClaudeBar
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full lowercase commit SHA"
            exit 1
          fi

          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked out $ACTUAL_SHA, expected $EXPECTED_SHA"
            exit 1
          fi

      # Use the Swift toolchain bundled with the runner's Xcode. Tuist macro
      # prebuilts must match that toolchain.

      - name: Install Tuist
        run: brew install tuist

      - name: Install Dependencies
        run: tuist install

      - name: Generate Project
        run: |
          tuist generate --no-open
          ./scripts/fix-swiftterm-metal.sh

      - name: Build Release
        run: |
          xcodebuild archive \
            -workspace "${APP_NAME}.xcworkspace" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -archivePath "build/${APP_NAME}.xcarchive" \
            -destination "generic/platform=macOS" \
            -skipMacroValidation \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          cp -R "build/${APP_NAME}.xcarchive/Products/Applications/${APP_NAME}.app" .

      - name: Create ZIP
        run: |
          ditto -c -k --keepParent "${APP_NAME}.app" "ClaudeBar-YOYAKU.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeBar-YOYAKU
          path: ClaudeBar-YOYAKU.zip
          retention-days: 14
