name: Build YOYAKU Theme

# Manual only (rules/02 cost discipline). Run via workflow_dispatch on the
# branch to verify; the current artifact remains unsigned until release v2.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA to build
        required: true
        type: string

env:
  APP_NAME: ClaudeBar

jobs:
  build:
    name: Build YOYAKU ClaudeBar
    runs-on: [self-hosted, macos, arm64, yoyaku-macos-ci]
    timeout-minutes: 60

    concurrency:
      group: claudebar-yoyaku-build
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full lowercase commit SHA"
            exit 1
          fi

          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked out $ACTUAL_SHA, expected $EXPECTED_SHA"
            exit 1
          fi

      # Use the Swift toolchain bundled with the runner's Xcode. Tuist macro
      # prebuilts must match that toolchain.

      - name: Install Tuist
        run: command -v tuist >/dev/null || brew install tuist

      - name: Cache Tuist
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/tuist
            .tuist-cache
          key: ${{ runner.os }}-${{ runner.arch }}-tuist-${{ hashFiles('Project.swift', 'Tuist.swift', 'Package.swift', 'Tuist/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-tuist-

      - name: Clean Tuist Cache
        run: |
          rm -rf Tuist/.build/tuist-derived
          tuist clean

      - name: Install Dependencies
        run: tuist install

      - name: Generate Project
        run: |
          tuist generate --no-open
          ./scripts/fix-swiftterm-metal.sh

      - name: Run Infrastructure Tests
        run: tuist test Infrastructure

      - name: Run Domain Tests
        run: tuist test Domain

      - name: Build Release
        run: |
          xcodebuild archive \
            -workspace "${APP_NAME}.xcworkspace" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -archivePath "build/${APP_NAME}.xcarchive" \
            -destination "generic/platform=macOS" \
            -skipMacroValidation \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          cp -R "build/${APP_NAME}.xcarchive/Products/Applications/${APP_NAME}.app" .

      - name: Create ZIP
        run: |
          ditto -c -k --keepParent "${APP_NAME}.app" "ClaudeBar-YOYAKU.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeBar-YOYAKU
          path: ClaudeBar-YOYAKU.zip
          retention-days: 14
