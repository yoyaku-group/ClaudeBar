name: Sync Contributors

# The all-contributors bot updates .all-contributorsrc and the README table when
# you comment "@all-contributors please add @user for code" on an issue or PR.
# It can't render the card grid on the landing page, so this workflow does that
# from the same source of truth, right after the bot's PR merges.

on:
  push:
    branches: [main]
    paths:
      - '.all-contributorsrc'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact commit to render (required by gha-safe)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sync-contributors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, linux, x64, yoyaku-linux-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify requested commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          RESOLVED_SHA="$(git rev-parse HEAD)"
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$RESOLVED_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checkout $RESOLVED_SHA does not match expected_sha $EXPECTED_SHA"
            exit 1
          fi

      - name: Render landing-page grid
        run: python3 scripts/sync-contributors.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "Landing page already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "docs: sync contributors to landing page [skip ci]"
          git push
